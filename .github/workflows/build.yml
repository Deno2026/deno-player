name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DenoVideoPlayer.sln

      - name: Build
        run: dotnet build DenoVideoPlayer.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/DenoVideoPlayer.Tests/DenoVideoPlayer.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DenoVideoPlayer.Tests/TestResults/*.trx
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore DenoVideoPlayer.csproj

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk

      - name: Publish portable build
        shell: pwsh
        run: |
          $out = "publish\DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64"
          dotnet publish DenoVideoPlayer.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $out

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "publish\DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64\*" `
            -DestinationPath "DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip" `
            -CompressionLevel Optimal

      - name: Publish installer build
        shell: pwsh
        run: |
          $out = "publish-sc\DenoVideoPlayer-win-x64"
          dotnet publish DenoVideoPlayer.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $out

      - name: Pack Velopack installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Releases -Force | Out-Null
          vpk pack `
            --packId DenoVideoPlayer `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir "publish-sc\DenoVideoPlayer-win-x64" `
            --mainExe DenoVideoPlayer.exe `
            --packTitle "Deno Video Player" `
            --packAuthors "DENO" `
            --icon icon.ico `
            --outputDir Releases `
            --yes `
            --skip-updates

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DenoVideoPlayer-${{ github.ref_name }}
          path: |
            Releases/*
            DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Deno Video Player ${{ github.ref_name }}
          generate_release_notes: false
          files: |
            Releases/*
            DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip
          body: |
            ## Deno Video Player ${{ github.ref_name }}

            A small Windows media player for opening local videos, audio, and images quickly.

            ### Download

            **Recommended:** download `DenoVideoPlayer-win-Setup.exe`, run it, and start using the app.

            The first launch prepares the playback backend automatically. No account, no cloud sync, no telemetry.

            ### Portable option

            Advanced users can download `DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip`, unzip it, and run `DenoVideoPlayer.exe`.

            ### Notes

            Windows SmartScreen may warn on early releases while the app builds reputation. Choose "More info" -> "Run anyway" only if you downloaded it from this GitHub release.
