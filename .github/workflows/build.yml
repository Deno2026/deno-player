name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DenoVideoPlayer.sln

      - name: Build
        run: dotnet build DenoVideoPlayer.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE "tests\DenoVideoPlayer.Tests\TestResults"
          dotnet test tests/DenoVideoPlayer.Tests/DenoVideoPlayer.Tests.csproj `
            -c Release --no-build --no-restore -- `
            --coverage `
            --coverage-output-format cobertura `
            --coverage-output coverage.cobertura.xml `
            --report-xunit-trx `
            --report-xunit-trx-filename test-results.trx `
            --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$coverage = Get-Content (Join-Path $results "coverage.cobertura.xml")
          if ([int]$coverage.coverage.'lines-valid' -le 0) {
            throw "Coverage collection produced no instrumented lines."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            tests/DenoVideoPlayer.Tests/TestResults/*.trx
            tests/DenoVideoPlayer.Tests/TestResults/coverage.cobertura.xml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH. Received: ${{ github.ref_name }}"
          }
          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag commit is not contained in origin/main."
          }

      - name: Verify project version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content DenoVideoPlayer.csproj
          $projectVersion = ($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($projectVersion -ne "${{ steps.version.outputs.version }}") {
            throw "DenoVideoPlayer.csproj version $projectVersion does not match tag ${{ github.ref_name }}."
          }

      - name: Prepare release notes from changelog
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $lines = [System.IO.File]::ReadAllLines(
            (Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"),
            [System.Text.Encoding]::UTF8)
          $header = "^## \[$([regex]::Escape($version))\](?:\s+-\s+.*)?$"
          $start = -1
          for ($i = 0; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match $header) {
              $start = $i
              break
            }
          }
          if ($start -lt 0) {
            throw "CHANGELOG.md is missing a release section for $version."
          }

          $end = $lines.Length
          for ($i = $start + 1; $i -lt $lines.Length; $i++) {
            if ($lines[$i] -match '^## \[') {
              $end = $i
              break
            }
          }

          $notes = [System.Collections.Generic.List[string]]::new()
          $notes.Add("## Deno Video Player ${{ github.ref_name }}")
          $notes.Add("")
          $notes.Add("A small Windows media player for opening local videos, audio, and images quickly.")
          $notes.Add("")
          for ($i = $start + 1; $i -lt $end; $i++) {
            $notes.Add($lines[$i])
          }
          $notes.Add("")
          $notes.Add("See the full user-facing history in [CHANGELOG.md](https://github.com/Deno2026/deno-video-player/blob/${{ github.ref_name }}/CHANGELOG.md).")
          $notes.Add("")
          $notes.Add("### Download")
          $notes.Add("")
          $notes.Add("**Recommended:** [Download the Windows installer](https://github.com/Deno2026/deno-video-player/releases/download/${{ github.ref_name }}/DenoVideoPlayer-win-Setup.exe), run ``DenoVideoPlayer-win-Setup.exe``, and open Deno Video Player.")
          $notes.Add("")
          $notes.Add("Windows 10/11 x64. No extraction, account, or separate codec installation is needed. Keep an internet connection available on the first launch while the app prepares its playback engine.")
          $notes.Add("")
          $notes.Add("### 한국어 설치 안내")
          $notes.Add("")
          $notes.Add("1. 위의 **Download the Windows installer** 링크를 누르세요.")
          $notes.Add("2. 받은 ``DenoVideoPlayer-win-Setup.exe``를 더블클릭해 설치하세요.")
          $notes.Add("3. **Deno Video Player**를 실행하고 영상을 창 안으로 끌어다 놓으세요.")
          $notes.Add("")
          $notes.Add("압축 해제나 회원가입은 필요 없습니다. Windows 10/11 64비트용이며, 첫 실행 때만 인터넷에 연결한 상태로 재생 도구 준비를 잠시 기다려 주세요.")
          $notes.Add("")
          $notes.Add("### Portable option")
          $notes.Add("")
          $notes.Add("Download ``DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip``, unzip it, and run ``DenoVideoPlayer.exe``.")
          $notes.Add("")
          $notes.Add("### Notes")
          $notes.Add("")
          $notes.Add('The app is not code-signed yet. For a SmartScreen unrecognized-app warning, choose "More info" -> "Run anyway" only if you trust the file and have verified that it came from this official GitHub release. Do not ignore malware detections or disable security features.')
          $notes.Add("")
          $notes.Add("Deno Video Player is released under ``GPL-3.0-only``. Bundled notices for third-party components are included in ``NOTICE.md``.")
          $notes.Add("")
          $notes.Add("[Corresponding source code for this version](https://github.com/Deno2026/deno-video-player/tree/${{ github.ref_name }}). Build instructions are in the README's Developer Notes section.")

          [System.IO.File]::WriteAllLines(
            (Join-Path $env:GITHUB_WORKSPACE "release-notes.md"),
            $notes,
            [System.Text.UTF8Encoding]::new($false))

      - name: Restore
        run: dotnet restore DenoVideoPlayer.csproj -r win-x64

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Clean release intermediates
        run: dotnet clean DenoVideoPlayer.csproj -c Release -r win-x64

      - name: Publish portable build
        shell: pwsh
        run: |
          $out = "publish\DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64"
          dotnet publish DenoVideoPlayer.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:FileVersion="${{ steps.version.outputs.version }}.0" `
            -p:InformationalVersion="${{ steps.version.outputs.version }}" `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $out

      - name: Verify portable release hygiene
        shell: pwsh
        run: |
          $out = "publish\DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64"
          $pdbs = @(Get-ChildItem -LiteralPath $out -Recurse -File -Filter *.pdb)
          if ($pdbs.Count -gt 0) {
            throw "Release publish unexpectedly contains PDB files."
          }

          $assembly = Join-Path $out "DenoVideoPlayer.dll"
          $binaryText = [System.Text.Encoding]::UTF8.GetString(
            [System.IO.File]::ReadAllBytes($assembly))
          if ($binaryText.Contains(
              $env:GITHUB_WORKSPACE,
              [System.StringComparison]::OrdinalIgnoreCase)) {
            throw "Release assembly contains the build workspace path."
          }

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "publish\DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64\*" `
            -DestinationPath "DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip" `
            -CompressionLevel Optimal

      - name: Publish installer build
        shell: pwsh
        run: |
          $out = "publish-sc\DenoVideoPlayer-win-x64"
          dotnet publish DenoVideoPlayer.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:FileVersion="${{ steps.version.outputs.version }}.0" `
            -p:InformationalVersion="${{ steps.version.outputs.version }}" `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $out

      - name: Pack Velopack installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Releases -Force | Out-Null
          vpk pack `
            --packId DenoVideoPlayer `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir "publish-sc\DenoVideoPlayer-win-x64" `
            --mainExe DenoVideoPlayer.exe `
            --packTitle "Deno Video Player" `
            --packAuthors "DENO" `
            --icon icon.ico `
            --outputDir Releases `
            --yes `
            --skip-updates

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DenoVideoPlayer-${{ github.ref_name }}
          path: |
            Releases/DenoVideoPlayer-win-Setup.exe
            Releases/DenoVideoPlayer-*.nupkg
            Releases/RELEASES
            Releases/releases.win.json
            DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          name: Deno Video Player ${{ github.ref_name }}
          generate_release_notes: false
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            Releases/DenoVideoPlayer-win-Setup.exe
            Releases/DenoVideoPlayer-*.nupkg
            Releases/RELEASES
            Releases/releases.win.json
            DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip
