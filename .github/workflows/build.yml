name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    env:
      TESTINGPLATFORM_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DenoVideoPlayer.sln

      - name: Build
        run: dotnet build DenoVideoPlayer.sln -c Release --no-restore

      - name: Test
        shell: pwsh
        run: |
          $results = Join-Path $env:GITHUB_WORKSPACE "tests\DenoVideoPlayer.Tests\TestResults"
          dotnet test tests/DenoVideoPlayer.Tests/DenoVideoPlayer.Tests.csproj `
            -c Release --no-build --no-restore -- `
            --coverage `
            --coverage-output-format cobertura `
            --coverage-output coverage.cobertura.xml `
            --report-xunit-trx `
            --report-xunit-trx-filename test-results.trx `
            --results-directory $results
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          [xml]$coverage = Get-Content (Join-Path $results "coverage.cobertura.xml")
          if ([int]$coverage.coverage.'lines-valid' -le 0) {
            throw "Coverage collection produced no instrumented lines."
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-results
          path: |
            tests/DenoVideoPlayer.Tests/TestResults/*.trx
            tests/DenoVideoPlayer.Tests/TestResults/coverage.cobertura.xml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH. Received: ${{ github.ref_name }}"
          }
          $version = $tag.Substring(1)
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Verify tag is on main
        shell: pwsh
        run: |
          git merge-base --is-ancestor $env:GITHUB_SHA origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Release tag commit is not contained in origin/main."
          }

      - name: Verify project version matches tag
        shell: pwsh
        run: |
          [xml]$project = Get-Content DenoVideoPlayer.csproj
          $projectVersion = ($project.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if ($projectVersion -ne "${{ steps.version.outputs.version }}") {
            throw "DenoVideoPlayer.csproj version $projectVersion does not match tag ${{ github.ref_name }}."
          }

      - name: Restore
        run: dotnet restore DenoVideoPlayer.csproj

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Publish portable build
        shell: pwsh
        run: |
          $out = "publish\DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64"
          dotnet publish DenoVideoPlayer.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:FileVersion="${{ steps.version.outputs.version }}.0" `
            -p:InformationalVersion="${{ steps.version.outputs.version }}" `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $out

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "publish\DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64\*" `
            -DestinationPath "DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip" `
            -CompressionLevel Optimal

      - name: Publish installer build
        shell: pwsh
        run: |
          $out = "publish-sc\DenoVideoPlayer-win-x64"
          dotnet publish DenoVideoPlayer.csproj `
            -c Release -r win-x64 `
            --self-contained true `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:FileVersion="${{ steps.version.outputs.version }}.0" `
            -p:InformationalVersion="${{ steps.version.outputs.version }}" `
            -p:PublishReadyToRun=true `
            -p:DebugType=none `
            -p:DebugSymbols=false `
            -o $out

      - name: Pack Velopack installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path Releases -Force | Out-Null
          vpk pack `
            --packId DenoVideoPlayer `
            --packVersion "${{ steps.version.outputs.version }}" `
            --packDir "publish-sc\DenoVideoPlayer-win-x64" `
            --mainExe DenoVideoPlayer.exe `
            --packTitle "Deno Video Player" `
            --packAuthors "DENO" `
            --icon icon.ico `
            --outputDir Releases `
            --yes `
            --skip-updates

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: DenoVideoPlayer-${{ github.ref_name }}
          path: |
            Releases/DenoVideoPlayer-win-Setup.exe
            Releases/DenoVideoPlayer-*.nupkg
            Releases/RELEASES
            Releases/releases.win.json
            DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # v3
        with:
          name: Deno Video Player ${{ github.ref_name }}
          generate_release_notes: false
          fail_on_unmatched_files: true
          files: |
            Releases/DenoVideoPlayer-win-Setup.exe
            Releases/DenoVideoPlayer-*.nupkg
            Releases/RELEASES
            Releases/releases.win.json
            DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip
          body: |
            ## Deno Video Player ${{ github.ref_name }}

            A small Windows media player for opening local videos, audio, and images quickly.

            ### What's new

            - Added a compact playlist menu for natural name, newest-first, and oldest-first ordering.
            - The selected order persists and is shared by the visible list, previous/next navigation, folder open, and folder drop.
            - Playlist scans and file-date reads now run away from the UI thread, with one-pass folder snapshots for faster interaction.
            - Current-media selection, rapid sort changes, overlapping open requests, subtitle drops, and shutdown races are handled safely.

            See the full user-facing details in [CHANGELOG.md](https://github.com/Deno2026/deno-video-player/blob/${{ github.ref_name }}/CHANGELOG.md).

            ### Download

            **Recommended:** download `DenoVideoPlayer-win-Setup.exe`, run it, and start using the app.

            The first launch prepares the playback backend automatically. No account, no cloud sync, no telemetry.

            ### Portable option

            Advanced users can download `DenoVideoPlayer-${{ github.ref_name }}-portable-win-x64.zip`, unzip it, and run `DenoVideoPlayer.exe`.

            ### Notes

            Windows SmartScreen may warn on early releases while the app builds reputation. Choose "More info" -> "Run anyway" only if you downloaded it from this GitHub release.

            Deno Video Player is released under `GPL-3.0-only`. Bundled notices for third-party components are included in `NOTICE.md`.
