name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore DenoPlayer.csproj

      - name: Build (Release)
        run: dotnet build DenoPlayer.csproj -c Release --no-restore /warnaserror-

      - name: Publish (win-x64, framework-dependent)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish DenoPlayer.csproj `
            -c Release -r win-x64 `
            --self-contained false `
            -o publish\DenoPlayer-win-x64

      - name: Zip publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path publish\DenoPlayer-win-x64\* -DestinationPath DenoPlayer-${{ github.ref_name }}-win-x64.zip

      - name: Upload artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: DenoPlayer-${{ github.ref_name }}-win-x64
          path: DenoPlayer-${{ github.ref_name }}-win-x64.zip
